<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='16' fill='%233A271E'/%3E%3Ccircle cx='17' cy='17' r='12.6' fill='none' stroke='%23C8901F' stroke-width='2'/%3E%3Ccircle cx='17' cy='17' r='8.3' fill='%232B1C15'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='16' fill='%233A271E'/%3E%3Ccircle cx='17' cy='17' r='12.6' fill='none' stroke='%23C8901F' stroke-width='2'/%3E%3Ccircle cx='17' cy='17' r='8.3' fill='%232B1C15'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Guitar Chords and Scales Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first practice stand. One view at a time, bottom tab bar, two columns on tablets. The fretboard is always rosewood, whatever the theme. */
:root{
  --bg:#ECEEE9; --surface:#F8F9F6; --surface-2:#DFE3DC; --fg:#1A201D; --muted:#56605A; --line:#CBD1C8;
  --brass:#9C6610; --brass-soft:#F2E3C3; --on-brass:#FFFFFF;
  --teal:#136A60; --teal-soft:#D3E8E3; --on-teal:#FFFFFF;
  --ok:#2C7A4B; --bad:#B0461C;
  --wood:#3A271E; --wood-2:#2B1C15; --fret:#BDB4A3; --nut:#E8E0CF; --string:#D9CFBC; --inlay:#8C7A66; --fb-muted:#A89A86;
  --note:#EDE6D6; --note-ink:#2B1C15;
  --f-display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --f-body:'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13110F; --surface:#1C1916; --surface-2:#2A2622; --fg:#EDE8E0; --muted:#A49B8F; --line:#37312B;
  --brass:#E3AA48; --brass-soft:#3B2D15; --on-brass:#1A1206;
  --teal:#4FB5A8; --teal-soft:#14302B; --on-teal:#08201C;
  --ok:#5CC08A; --bad:#EE8559;
  --wood:#2E1F18; --wood-2:#1F1510; --fret:#9E9584; --nut:#CFC6B2; --string:#BDB3A0; --inlay:#6E5F4F; --fb-muted:#8C7F6D;
  --note:#E5DDCB; --note-ink:#1F1510; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#13110F; --surface:#1C1916; --surface-2:#2A2622; --fg:#EDE8E0; --muted:#A49B8F; --line:#37312B;
  --brass:#E3AA48; --brass-soft:#3B2D15; --on-brass:#1A1206;
  --teal:#4FB5A8; --teal-soft:#14302B; --on-teal:#08201C;
  --ok:#5CC08A; --bad:#EE8559;
  --wood:#2E1F18; --wood-2:#1F1510; --fret:#9E9584; --nut:#CFC6B2; --string:#BDB3A0; --inlay:#6E5F4F; --fb-muted:#8C7F6D;
  --note:#E5DDCB; --note-ink:#1F1510; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px)}
.app{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800;line-height:1.1}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
header.top{display:flex;align-items:center;gap:10px;padding-block:14px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.12rem;letter-spacing:-.01em;margin-right:auto;min-width:0}
.brand svg{flex:none}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.sync[data-s="synced"] i{background:var(--ok)}
.sync[data-s="connecting"] i{background:var(--brass)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{stroke:var(--fg)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px))}
nav .inner{display:grid;grid-template-columns:repeat(7,1fr);max-width:760px;margin:0 auto}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:.68rem;font-weight:700;color:var(--muted);min-height:52px;border-radius:10px}
nav button svg{stroke:currentColor}
nav button[aria-current="page"]{color:var(--brass)}
nav button[aria-current="page"] svg{stroke-width:2.4}

/* building blocks */
.view{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;gap:16px}
@media (min-width:860px){ .cols{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)} }
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);border-color:transparent;color:var(--on-brass)}
.btn.teal{background:var(--teal);border-color:transparent;color:var(--on-teal)}
.btn.big{min-height:54px;font-size:1.05rem;padding:0 24px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:36px;padding:0 12px;border:0;background:transparent;border-radius:9px;color:var(--muted);font-weight:700;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.78rem;font-weight:700;color:var(--muted)}
select{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 .95rem var(--f-body);padding:0 10px;max-width:100%}
input[type=range]{accent-color:var(--brass);width:100%}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.tempo{display:flex;align-items:center;gap:8px}
.tempo .val{font:700 1.6rem var(--f-mono);min-width:3ch;text-align:center}
.tempo .btn{min-width:44px;padding:0}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{font-size:.88rem;color:var(--muted)}
.callout{border-left:3px solid var(--brass);padding:4px 0 4px 12px}

/* today */
.hero{display:grid;gap:14px;grid-template-columns:1fr auto;align-items:end}
.stat{text-align:right}
.stat b{display:block;font:800 2.4rem/1 var(--f-display)}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:4px}
.days i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);max-width:100%}
.days i.on{background:var(--brass)}
.days i.today{outline:2px solid var(--teal);outline-offset:1px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center}
.check svg{opacity:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] svg{opacity:1;stroke:#fff}
.steps h3 small{font:700 .75rem var(--f-mono);color:var(--muted);margin-left:6px}
.steps p{font-size:.9rem;color:var(--muted)}

/* chord diagram */
.cd{display:block;width:100%;height:auto}
.cd .g{stroke:var(--muted);stroke-width:1.3}
.cd .nutbar{fill:var(--fg)}
.cd .dot{fill:var(--fg)}
.cd .dot.root{fill:var(--brass)}
.cd .fing{fill:var(--bg);font:700 11px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.cd .dot.root + .fing{fill:var(--on-brass)}
.cd .bar{fill:var(--fg)}
.cd .mk{fill:none;stroke:var(--muted);stroke-width:1.6}
.cd .mk.root{stroke:var(--brass);stroke-width:2.2}
.cd .lbl{fill:var(--muted);font:700 11px var(--f-mono)}
.cd .xm{fill:var(--muted);font:700 13px var(--f-mono);text-anchor:middle}
.stage{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:520px){ .stage{grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:12px} }
.cname{font:800 2.6rem/1 var(--f-display);letter-spacing:-.02em}
.tones{font-family:var(--f-mono);font-size:.88rem;color:var(--muted)}
.tones b{color:var(--fg)}
.libgrid{display:flex;flex-direction:column;gap:14px}

/* fretboard */
.fbwrap{overflow-x:auto;background:var(--wood-2);border-radius:14px;padding:10px 0 6px;-webkit-overflow-scrolling:touch;max-width:100%}
.fb{display:block;margin:0 auto}
.fb .board{fill:var(--wood)}
.fb .fw{stroke:var(--fret);stroke-width:2}
.fb .nutl{stroke:var(--nut);stroke-width:6}
.fb .str{stroke:var(--string)}
.fb .inlay{fill:var(--inlay)}
.fb .fnum{fill:var(--fb-muted);font:700 10px var(--f-mono);text-anchor:middle}
.fb .snm{fill:var(--fb-muted);font:700 10px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.fb .nt{cursor:pointer}
.fb .hit{fill:transparent;cursor:pointer}
.fb .hit:hover{fill:var(--teal);fill-opacity:.25}
.fb .nt circle{fill:var(--note);stroke:var(--wood-2);stroke-width:1.5;transition:fill .08s}
.fb .nt text{fill:var(--note-ink);font:700 10px var(--f-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fb .nt.root circle{fill:var(--brass)}
.fb .nt.root text{fill:var(--on-brass)}
.fb .nt.out{opacity:.25}
.fb .nt.now circle{fill:var(--teal);stroke:var(--teal-soft);stroke-width:4}
.fb .nt.now text{fill:var(--on-teal)}
.fb .nt.good circle{fill:var(--ok)}
.fb .nt.good text{fill:#fff}
.fb .nt.wrong circle{fill:var(--bad)}
.fb .nt.wrong text{fill:#fff}

/* practice readouts */
.readout{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bignote{font:800 2.4rem/1 var(--f-display);min-width:4ch}
.beats{display:flex;gap:8px;align-items:center}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--surface-2);transition:background .05s}
.beats i.first{width:18px;height:18px}
.beats i.on{background:var(--brass)}
.waitpad{width:100%;min-height:96px;border-radius:16px;border:2px dashed var(--teal);background:var(--teal-soft);color:var(--fg);font:800 1.2rem var(--f-display)}

/* drills */
.rs-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.55fr);gap:16px;align-items:end}
.rs-now .cname{font-size:3.2rem}
.rs-next{opacity:.7}
.rs-next.ready{opacity:1}
.rs-next .cname{font-size:1.6rem}
.timer{display:grid;place-items:center;position:relative;width:min(220px,60vw);aspect-ratio:1;margin:0 auto}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .trk{stroke:var(--surface-2)}
.timer .prog{stroke:var(--brass);transition:stroke-dashoffset .2s linear}
.timer b{font:800 3rem/1 var(--f-display)}
.tap{width:100%;min-height:120px;border-radius:20px;border:0;background:var(--brass);color:var(--on-brass);font:800 1.4rem var(--f-display);touch-action:manipulation}
.tap:active{transform:scale(.985)}
.tap[disabled]{background:var(--surface-2);color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:5px;height:72px}
.bars div{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars div.best{background:var(--brass)}

/* ear */
.strings6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.sbtn b{font:800 1.6rem/1 var(--f-display)}
.sbtn span{font:700 .7rem var(--f-mono);color:var(--muted)}
.sbtn[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.answers.notes{grid-template-columns:repeat(6,1fr)}
@media (max-width:420px){ .answers.notes{grid-template-columns:repeat(4,1fr)} }
.ans{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:800 1.05rem var(--f-display)}
.ans.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.ans.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.score{font:700 .9rem var(--f-mono);color:var(--muted)}
.feedback{min-height:1.5em;font-weight:700}
.feedback.good{color:var(--ok)} .feedback.wrong{color:var(--bad)}

/* learn */
.lessons{display:grid;gap:14px}
@media (min-width:860px){ .lessons{grid-template-columns:1fr 1fr} }
.lesson{display:flex;flex-direction:column;gap:10px}
.lesson .analogy{font:600 1.08rem/1.35 var(--f-display);color:var(--brass)}
.lesson ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:4px;font-size:.94rem}
.lesson .btn{align-self:flex-start;margin-top:auto}
.lnum{font:700 .78rem var(--f-mono);color:var(--muted)}

/* settings */
.settings{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.steps .why{color:var(--teal);font-weight:700;font-size:.82rem;margin-top:2px}
.pbar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}.pbar b{display:block;height:100%;background:var(--ok)}
.sgrid{display:grid;gap:6px}
.sgrid>div{border-radius:12px;background:var(--surface-2);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:background .06s}
.sgrid b{font:800 1.7rem/1 var(--f-display)}
.sgrid span{font:700 .78rem var(--f-mono);color:var(--muted)}
.sgrid .rest b{opacity:.35}
.sgrid .now{outline:3px solid var(--teal);outline-offset:-3px}
.sgrid .good{background:var(--ok);color:#fff}.sgrid .late{background:var(--brass);color:var(--on-brass)}.sgrid .wrong{background:var(--bad);color:#fff}
.sgrid .good span,.sgrid .late span,.sgrid .wrong span{color:inherit}
#pg-strip .chip[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.path{display:flex;flex-direction:column}
.path>div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.path>div:first-child{border-top:0}
.path i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.8rem;color:#fff}
.path .done i{background:var(--ok);border-color:var(--ok)}
.path .done p{color:var(--muted)}
/* listening */
.fb .nt.late circle{fill:var(--brass)}
.fb .nt.late text{fill:var(--on-brass)}
.micchip{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;padding:0 12px;font-weight:700;font-size:.82rem;white-space:nowrap;flex:none}
.micchip i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:transform .08s}
.micchip[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.micchip[aria-pressed="true"] i{background:var(--teal)}
@media (max-width:460px){ .sync span{display:none} .micchip span{display:none} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px);z-index:30;max-width:min(560px, calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:.92rem;box-shadow:0 8px 28px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:var(--brass-soft);font-weight:700;text-decoration:underline;padding:0}
.listenbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--teal-soft)}
.listenbar .lv{flex:1;min-width:80px;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.listenbar .lv b{display:block;height:100%;width:0;background:var(--teal);transition:width .08s}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tally div{background:var(--surface-2);border-radius:12px;padding:8px;text-align:center;min-width:0}
.tally b{display:block;font:800 1.5rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tally span{font-size:.72rem;font-weight:700;color:var(--muted)}
.tally .g b{color:var(--ok)} .tally .l b{color:var(--brass)} .tally .m b{color:var(--bad)}
.fbchips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.fbchips span{padding:5px 10px;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--surface-2)}
.fbchips .good{background:var(--ok);color:#fff} .fbchips .late{background:var(--brass);color:var(--on-brass)} .fbchips .wrong{background:var(--bad);color:#fff}
.checkrows{display:flex;flex-direction:column;gap:6px}
.checkrows div{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.checkrows div b{font:800 1.1rem var(--f-display)}
.checkrows .now{outline:2px solid var(--teal)}
.checkrows .ok{background:color-mix(in srgb, var(--ok) 18%, var(--surface))}
.checkrows .bad{background:color-mix(in srgb, var(--bad) 18%, var(--surface))}
.checkrows em{font-style:normal;font-weight:700;font-size:.8rem}
.gauge{width:100%;max-width:340px;margin:0 auto;display:block}
.gauge .arc{stroke:var(--surface-2)} .gauge .zone{stroke:var(--ok)} .gauge .tick{stroke:var(--muted)}
.gauge .needle{stroke:var(--fg);transition:transform .12s ease-out;transform-origin:150px 150px}
.gauge .needle.in{stroke:var(--ok)}
.tunerread{text-align:center}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------------- chord library ---------------- */
const CHORDS=[
 {n:'Em',g:1,f:[0,2,2,0,0,0],fi:[0,2,3,0,0,0],tip:'Two fingers, six ringing strings. This is home base: when a change falls apart, land here.'},
 {n:'Am',g:1,f:[-1,0,2,2,1,0],fi:[0,0,2,3,1,0],tip:'The Em shape moved across one string, plus the index on the B string. Skip the low E.'},
 {n:'C',g:1,f:[-1,3,2,0,1,0],fi:[0,3,2,0,1,0],tip:'A staircase walking down: ring on fret 3, middle on 2, index on 1. Arch the knuckles so the open G still rings.'},
 {n:'G',g:1,f:[3,2,0,0,0,3],fi:[2,1,0,0,0,3],tip:'A wide grip across the whole neck. Strum all six strings and let the open middle strings ring.'},

 {n:'Dm',g:1,f:[-1,-1,0,2,3,1],fi:[0,0,0,2,3,1],tip:'The D triangle with its top note lowered one fret. That single fret is the whole difference between bright and sad.'},
 {n:'A7',g:2,f:[-1,0,2,0,2,0],fi:[0,0,2,0,3,0],tip:'An A chord with a gap: the G string rings open. Sevenths sound like they want to move somewhere.'},
 {n:'D7',g:2,f:[-1,-1,0,2,1,2],fi:[0,0,0,2,1,3],tip:'The D triangle turned upside down. A staple of blues and folk turnarounds.'},
 {n:'E7',g:2,f:[0,2,0,1,0,0],fi:[0,2,0,1,0,0],tip:'E without the ring finger. Two fingers, plenty of pull toward A.'},

 {n:'Am7',g:2,f:[-1,0,2,0,1,0],fi:[0,0,2,0,1,0],tip:'Am with one finger lifted. Softer and jazzier.'},
 {n:'Em7',g:2,f:[0,2,0,0,0,0],fi:[0,2,0,0,0,0],tip:'One finger. A breather chord between harder shapes.'},
 {n:'Cmaj7',g:2,f:[-1,3,2,0,0,0],fi:[0,3,2,0,0,0],tip:'C with the index lifted off. Dreamy and open.'},
 {n:'Fmaj7',g:2,f:[-1,-1,3,2,1,0],fi:[0,0,3,2,1,0],tip:'The friendly F: the C staircase moved over one string. A bridge to the full F barre.'},
 {n:'Dsus2',g:2,f:[-1,-1,0,2,3,0],fi:[0,0,0,1,3,0],tip:'D with the middle finger lifted. Sus chords are neither happy nor sad, like a question waiting for an answer.'},
 {n:'Dsus4',g:2,f:[-1,-1,0,2,3,3],fi:[0,0,0,1,3,4],tip:'D with the pinky added on fret 3. Rock between Dsus4, D and Dsus2.'},
 {n:'Asus2',g:2,f:[-1,0,2,2,0,0],fi:[0,0,1,2,0,0],tip:'A with the B string left open. It shimmers on steel strings.'},
 {n:'Asus4',g:2,f:[-1,0,2,2,3,0],fi:[0,0,1,2,3,0],tip:'A with fret 3 on the B string. Resolve it back to A for the classic pop move.'},
 {n:'Cadd9',g:2,f:[-1,3,2,0,3,3],fi:[0,2,1,0,3,4],tip:'Ring and pinky stay put when you move to G. That anchor makes G to Cadd9 one of the smoothest changes on guitar.'},
 {n:'F',g:3,f:[1,3,3,2,1,1],fi:[1,3,4,2,1,1],tip:'The E shape, with your index acting as a capo at fret 1. Roll the index slightly onto its bony edge.'},
 {n:'Fm',g:3,f:[1,3,3,1,1,1],fi:[1,3,4,1,1,1],tip:'F with the middle finger lifted. The barre now carries the G string too.'},
 {n:'F#m',g:3,f:[2,4,4,2,2,2],fi:[1,3,4,1,1,1],tip:'The Fm shape slid up one fret. Same cookie cutter, new spot on the neck.'},
 {n:'G (barre)',g:3,f:[3,5,5,4,3,3],fi:[1,3,4,2,1,1],tip:'The F shape at fret 3. Compare it with open G: same name, different colour.'},
 {n:'Bb',g:3,f:[-1,1,3,3,3,1],fi:[0,1,2,3,4,1],tip:'The A shape with an index barre at fret 1. Many players flatten the ring finger across the three strings instead.'},
 {n:'B',g:3,f:[-1,2,4,4,4,2],fi:[0,1,2,3,4,1],tip:'The Bb shape one fret higher. Mute the low E with the tip of your index.'},
 {n:'Bm',g:3,f:[-1,2,4,4,3,2],fi:[0,1,3,4,2,1],tip:'The Am shape with an index barre at fret 2. The most common barre chord in pop songs.'},
 {n:'Cm',g:3,f:[-1,3,5,5,4,3],fi:[0,1,3,4,2,1],tip:'Bm slid up one fret. Every A-shape minor chord is the same hand, moved.'},
];
const GROUPS={1:'Open chords',2:'Sevenths, sus and colour chords',3:'Barre chords'};
const PAIRS={
 1:[['Em','Am'],['C','G'],['G','D'],['D','A'],['A','E'],['Am','C'],['Em','G'],['D','Em'],['A','Dm'],['E','Am'],['C','D'],['G','Am']],
 2:[['G','Cadd9'],['A7','D7'],['E7','A7'],['C','Fmaj7'],['Dsus4','D'],['B7','E'],['Am7','D7'],['G7','C']],
 3:[['F','C'],['Bm','G'],['F','G (barre)'],['Bm','A'],['Bb','F'],['F#m','D'],['Cm','Bb'],['F','Am']]};
const SETS={
 1:[['G','C','D'],['Am','C','G'],['Em','C','G','D'],['C','G','Am','Em'],['D','A','Em'],['E','A','D'],['Am','Dm','E']],
 2:[['G','Cadd9','D'],['A7','D7','E7'],['C','Fmaj7','G'],['D','Dsus4','Dsus2'],['Am7','D7','Cmaj7'],['E','B7','A']],
 3:[['F','C','G'],['Bm','G','D','A'],['F','Bb','C'],['F#m','D','A','E'],['Cm','Bb','F']]};
const SCALES={
 major:{name:'Major',iv:[0,2,4,5,7,9,11],nps:3},
 minor:{name:'Natural minor',iv:[0,2,3,5,7,8,10],nps:3},
 minpent:{name:'Minor pentatonic',iv:[0,3,5,7,10],nps:2},

};
const WEEK_SCALES={
 1:[{root:4,scale:'minpent',pos:0},{root:9,scale:'minpent',pos:0},{root:7,scale:'major',pos:0},{root:0,scale:'major',pos:0}],
 2:[{root:9,scale:'blues',pos:0},{root:4,scale:'minor',pos:0},{root:2,scale:'major',pos:0},{root:7,scale:'majpent',pos:0}],
 3:[{root:9,scale:'minpent',pos:1},{root:9,scale:'minpent',pos:2},{root:5,scale:'major',pos:0},{root:11,scale:'minor',pos:0}]};

const chordBy=n=>CHORDS.find(c=>c.n===n)||CHORDS[0];
const levelChords=()=>CHORDS.filter(c=>c.g<=state.settings.level);
function rootOf(n){const m=n.match(/^([A-G])([#b]?)/);let v={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='#')v++;if(m[2]==='b')v--;return pc(v);}
const isMinor=n=>/^[A-G][#b]?m(?!aj)/.test(n);
const label=n=>n.replace(/^([A-G])#/,'$1♯').replace(/^([A-G])b/,'$1♭');
function chordNames(n){const r=rootOf(n);return ([5,10,3,8,1].includes(r)||(isMinor(n)&&[2,7,0,5].includes(r)))?FLAT:SHARP;}
function scaleNames(root,key){if(key==='chrom')return SHARP;const minorish=['minor','minpent','blues'].includes(key);return (minorish?[2,7,0,5,10,3]:[5,10,3,8,1]).includes(root)?FLAT:SHARP;}

/* ---------------- state + storage ---------------- */
const LS='gtr-trainer-v1';
const DEFAULT=()=>({v:1,updatedAt:0,settings:{tone:'steel',lefty:false,level:1,vol:0.8,sens:'normal',phones:false,latency:80,calibrated:false,sessLen:'std'},days:{},today:{d:'',done:{}},changes:{},ear:{mm:{c:0,t:0},wc:{c:0,t:0},nf:{c:0,t:0}},tempo:{},stats:{runs:[],notes:{},chords:{}},neck:{find:{}},miles:{tuned:false},welcomed:false});
function merge(d,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))d[k]=merge(d[k],s[k]);else d[k]=s[k];}return d;}
function load(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&s.v===1)return merge(DEFAULT(),s);}catch(e){}return DEFAULT();}
let state=load();
function save(){state.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}Sync.schedule();}
const dkey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayNum=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);};
function ensureToday(){const t=dkey();if(state.today.d!==t){state.today={d:t,done:{}};}}
function streak(){let n=0;const d=new Date();if(!state.days[dkey(d)])d.setDate(d.getDate()-1);while(state.days[dkey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function weekMinutes(){let s=0;const d=new Date();for(let i=0;i<7;i++){s+=state.days[dkey(d)]||0;d.setDate(d.getDate()-1);}return s;}

const Sync={ref:null,writing:false,pending:false,t:null,
 async init(){
  if(!(window.claude&&typeof window.claude.use==='function')){setSync('local');return;}
  setSync('connecting');
  const timer=setTimeout(()=>{if($('#sync').dataset.s==='connecting')setSync('local');},10000);
  try{
   const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
   if(!db||!user){clearTimeout(timer);setSync('local');return;}
   const id=await user.id();
   if(!id){clearTimeout(timer);setSync('local');return;}
   Sync.ref=db.doc('data/users/'+id+'/trainer');
   Sync.ref.onSnapshot(snap=>{
     if(!snap.metadata.fromCache){clearTimeout(timer);setSync('synced');}
     const remote=snap.exists?(snap.data()||{}).state:null;
     if(remote&&remote.v===1&&remote.updatedAt>state.updatedAt){
       state=merge(DEFAULT(),JSON.parse(JSON.stringify(remote)));
       try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
       A.apply(); if(!Run.stop) renderView(VIEW); else if(VIEW==='today') renderToday();
     } else if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites&&(!remote||remote.updatedAt<state.updatedAt)&&state.updatedAt>0){Sync.push();}
   },()=>{clearTimeout(timer);Sync.ref=null;setSync('local');});
  }catch(e){clearTimeout(timer);setSync('local');}
 },
 schedule(){if(!this.ref)return;clearTimeout(this.t);this.t=setTimeout(()=>this.push(),1500);},
 async push(){
  if(!this.ref)return; if(this.writing){this.pending=true;return;}
  this.writing=true;
  try{await this.ref.set({state:JSON.parse(JSON.stringify(state))});}
  catch(e){if(e&&e.code==='unavailable'){setTimeout(()=>this.schedule(),2000+rnd(2000));}else if(e&&e.code!=='resource_exhausted'){this.ref=null;setSync('local');}}
  this.writing=false; if(this.pending){this.pending=false;this.push();}
 }};
function setSync(s){const el=$('#sync');el.dataset.s=s;el.querySelector('span').textContent=s==='synced'?'Synced to your account':s==='connecting'?'Connecting…':'Saved on this device';}

/* ---------------- audio ---------------- */
const A={ctx:null,cache:new Map(),
 init(){
  if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();
   this.master=this.ctx.createGain();this.comp=this.ctx.createDynamicsCompressor();this.master.connect(this.comp).connect(this.ctx.destination);
   this.tone=this.ctx.createBiquadFilter();this.tone.type='lowpass';
   this.body=this.ctx.createBiquadFilter();this.body.type='peaking';this.body.frequency.value=190;this.body.Q.value=1.1;this.body.gain.value=4;
   this.tone.connect(this.body).connect(this.master);this.apply();}

 },
 apply(){if(!this.ctx)return;this.master.gain.value=state.settings.vol;this.tone.frequency.value=state.settings.tone==='nylon'?2600:6800;this.cache.clear();},
 now(){return this.ctx.currentTime+0.03;},
 buf(m){
  if(this.cache.has(m))return this.cache.get(m);
  const nyl=state.settings.tone==='nylon',sr=this.ctx.sampleRate,f=440*Math.pow(2,(m-69)/12),N=Math.floor(sr/f),len=Math.floor(sr*(nyl?2.4:3.2));
  const ring=new Float32Array(N);for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;
  for(let p=0;p<(nyl?3:1);p++)for(let i=0;i<N;i++)ring[i]=(ring[i]+ring[(i+1)%N])*0.5;
  let mean=0;for(let i=0;i<N;i++)mean+=ring[i];mean/=N;for(let i=0;i<N;i++)ring[i]-=mean;
  const b=this.ctx.createBuffer(1,len,sr),out=b.getChannelData(0),damp=nyl?0.994:0.9965;let idx=0,peak=0;
  for(let i=0;i<len;i++){const a=ring[idx],c=ring[(idx+1)%N];out[i]=a;ring[idx]=(a+c)*0.5*damp;idx=(idx+1)%N;const v=a<0?-a:a;if(v>peak)peak=v;}
  const g=0.9/(peak||1);for(let i=0;i<len;i++)out[i]*=g;
  const fade=Math.floor(sr*0.06);for(let i=0;i<fade;i++)out[len-1-i]*=i/fade;
  const r={b,rate:f/(sr/(N+0.5))};this.cache.set(m,r);return r;
 },

function insightsHTML(){
  const st=state.stats,runs=st.runs.slice(-12);
  if(!runs.length&&!Object.keys(st.chords).length)return `<div class="card stack"><h2>Your playing</h2>
    <p class="muted">Switch on listening in any drill: chord check, scale play-along, rhythm switch, one-minute changes or the tuner. Accuracy, timing and trouble spots then collect here.</p>
    <p class="note">${state.settings.calibrated?'Timing is calibrated.':'First time? Run Settings → Calibrate timing so early and late readings are exact.'}</p></div>`;
  const avg=runs.length?Math.round(runs.reduce((a,r)=>a+r.acc,0)/runs.length):0;
  const offs=runs.filter(r=>r.off!=null).slice(-8).map(r=>r.off),off=offs.length?Math.round(offs.reduce((a,b)=>a+b,0)/offs.length):null;
  const rate=r=>r.m/(r.h+r.m);
  const trouble=Object.entries(st.notes).filter(([k,r])=>r.h+r.m>=4&&rate(r)>=0.3).sort((a,b)=>rate(b[1])-rate(a[1])).slice(0,3);
  const chords=Object.entries(st.chords).filter(([n,r])=>r.t>=3&&r.ok/r.t<0.75).sort((a,b)=>a[1].ok/a[1].t-b[1].ok/b[1].t).slice(0,3);
  return `<div class="card stack" style="gap:0"><h2 style="margin-bottom:4px">Your playing</h2>
   ${runs.length?`<div class="insight"><span class="eyebrow">Accuracy · last ${runs.length} graded runs · average ${avg}%</span><div class="sparks">${runs.map(r=>`<div style="height:${Math.max(6,r.acc)}%" title="${r.d} · ${esc(r.name)} · ${r.acc}%"></div>`).join('')}</div></div>`:''}

   ${trouble.length?`<div class="insight"><span class="eyebrow">Trouble spots on the neck</span><p>${trouble.map(([k,r])=>`${posName(k)}: missed ${r.m} of ${r.h+r.m}`).join('<br>')}</p></div>`:''}

function ckStrum(c,ev){
  const names=chordNames(c.n),pcs=[...new Set(c.f.map((f,i)=>f>=0?pc(OPEN[i]+f):null).filter(x=>x!=null))];
  const tp=TPL(c),tmax=Math.max(...tp),sim=DSP.cos(ev.ch,tp),missing=pcs.filter(p=>ev.ch[p]<0.2),extra=[...Array(12).keys()].filter(p=>!pcs.includes(p)&&ev.ch[p]>=tp[p]/tmax+0.45);
  const like=levelChords().map(x=>[x.n,DSP.cos(ev.ch,TPL(x.n))]).sort((a,b)=>b[1]-a[1])[0];
  const clean=sim>=0.84&&!missing.length&&!extra.length;
  const strOf=p=>c.f.map((f,i)=>f>=0&&pc(OPEN[i]+f)===p?`${SNAME[i]} string (${f?'fret '+f:'open'})`:null).filter(Boolean).join(' or ');
  const tips=[];
  missing.forEach(p=>tips.push(`No ${names[p]} heard. Check the ${strOf(p)}: a neighbouring finger may be touching it, or the fingertip is too far from the fret.`));
  extra.forEach(p=>tips.push(`An extra ${names[p]} is ringing. A string marked × may be sounding, or a finger is on the wrong fret.`));
  if(!clean&&!tips.length)tips.push('Some notes are weak. Press closer to the frets and strum through every string the chord needs.');
  const badStr=c.f.map((f,i)=>f>=0&&missing.includes(pc(OPEN[i]+f))?i:null).filter(x=>x!=null);
  recordChord(c.n,clean,badStr);
  $('#ck-out').innerHTML=`${listenBar('Listening. Strum again any time.')}
   <div class="stack" style="gap:8px;margin-top:10px"><div class="row" style="justify-content:space-between"><h3 style="color:var(${clean?'--ok':'--bad'})">${clean?'Clean chord':'Not quite clean'}</h3><span class="score">Match ${Math.round(sim*100)}%</span></div>
   <p class="tones">${pcs.map(p=>`<b style="color:var(${ev.ch[p]>=0.2?'--ok':'--bad'})">${names[p]}</b>`).join(' · ')}</p>
   ${tips.map(t=>`<p class="note">${t}</p>`).join('')}
   ${!clean&&like[0]!==c.n.split(' ')[0]&&like[1]>sim+0.03?`<p class="note">It sounded closer to ${label(like[0])}.</p>`:''}</div>`;
}
function hintSemis(d){const o=((Math.round(d)%12)+12)%12;return o===0?'right note, other octave':o===1?'one fret too high':o===11?'one fret too low':'wrong string or fret';}

function chHear(ev){
  const sa=DSP.cos(ev.ch,TPL(CH.a)),sb=DSP.cos(ev.ch,TPL(CH.b)),h=$('#ch-heard');

  const lab=sa>sb?CH.a:CH.b;
  if(CH.lastLab&&lab!==CH.lastLab){CH.count++;$('#ch-count').textContent=CH.count;}
  CH.lastLab=lab;if(h)h.textContent=`Heard ${label(lab)}`;
}

function tuPitch(ev){
  if(!ev.f||ev.clarity<0.88){if(TU.hist.length)TU.hist.shift();return;}

  let s=0;for(let i=1;i<6;i++)if(Math.abs(m-OPEN[i])<Math.abs(m-OPEN[s]))s=i;
  const near=Math.abs(m-OPEN[s])<=1.5,target=near?OPEN[s]:Math.round(m),cents=Math.round((m-target)*100);
  const ndl=$('#tu-needle'),note=$('#tu-note'),msg=$('#tu-msg');if(!ndl)return;
  ndl.style.transform=`rotate(${Math.max(-50,Math.min(50,cents))*1.2}deg)`;ndl.classList.toggle('in',Math.abs(cents)<5);
  note.textContent=near?`${SNAME[s]} string`:SHARP[pc(target)];
  const hz=(440*Math.pow(2,(m-69)/12)).toFixed(1);
  msg.textContent=!near?`${hz} Hz · ${SHARP[pc(target)]}, not a standard open string`:Math.abs(cents)<5?`${hz} Hz · in tune`:cents<0?`${hz} Hz · ${-cents} cents flat: tighten slowly`:`${hz} Hz · ${cents} cents sharp: loosen a little, then come back up`;
  if(near&&Math.abs(cents)<5){if(++TU.inT>35&&!TU.tuned[s]){TU.tuned[s]=true;if(Object.keys(TU.tuned).length>=6&&!state.miles.tuned){state.miles.tuned=true;save();toast('All six strings in tune. Milestone done.');}const el=$('#tu-s'+s);if(el){el.classList.add('tuned');el.querySelector('span').textContent='in tune';}}}else TU.inT=0;
}

 {t:'The pentatonic is five stepping stones',a:'Take away the two slippery stones of the major scale and you can’t fall in the river. Every note left sounds good over the key.',b:'Minor pentatonic is root, ♭3, 4, 5, ♭7. That safety is why almost every guitar solo starts here.',h:['A minor pentatonic, box 1 at fret 5. The index plays fret 5 on every string.','Use the ring finger for fret 7 and the pinky for fret 8.','Play-along at 70 bpm, up and down. Three clean loops, then +5.'],go:['scales',{root:9,scale:'minpent',pos:0}],cta:'Open A minor pentatonic'},
 {t:'Positions are rooms in one house',a:'A scale covers the whole neck, but you live in one room at a time. The rooms share walls, which are the notes they have in common.',b:'Learn one position until it’s automatic, then walk into the next one and find the shared notes.',h:['Play position 1, then position 2 of A minor pentatonic.','Find the notes the two positions share; those are your doorways.','Switch to “Whole neck” to see the full house with your room highlighted.'],go:['scales',{root:9,scale:'minpent',pos:1,whole:true}],cta:'Open position 2'},
 {t:'A barre is a capo made of your finger',a:'Your index finger lays down a new nut. The other fingers play an open shape on top of it. The shape is a cookie cutter: slide it along the neck to stamp out a new chord at every fret.',b:'The E shape with a barre at fret 1 is F. At fret 3 it’s G. Same hand, different place.',h:['Barre fret 1 with only the index. Pick each string and roll the finger slightly until all six ring.','Add the E shape on top with fingers 2, 3 and 4. That is F.','Slide the whole hand to fret 3 for G. Keep the shape locked.'],go:['chords',{chord:'F'}],cta:'Open F barre'},
 {t:'Tuning by ear: two ceiling fans',a:'Two notes slightly out of tune wobble, like two fans spinning at slightly different speeds. The slower the wobble, the closer you are.',b:'Tune up to the note, not down to it. Strings hold pitch better when the last move tightens them.',h:['Put the low E reference on repeat.','Pluck your low E with it and turn the peg slowly until the wobble disappears.','Repeat for every string, then strum G to check.'],go:['ear',{panel:'tuner'}],cta:'Open tuner'},
 {t:'The metronome is a treadmill',a:'Set it slow enough that you never fall off. Speed comes from clean repetitions, not from turning the dial.',b:'Rule of three: three clean runs in a row, add 5 bpm. One mistake, drop 5 bpm. Your fingers learn exactly what you repeat, mistakes included.',h:['Spider warm-up at 60 bpm, one note per click.','Move to two notes per click once 80 bpm feels easy.','Slide the frets window up the neck as your stretch improves.'],go:['scales',{scale:'chrom',pos:0}],cta:'Open spider warm-up'},
 {t:'Steel or nylon: highway or boulevard',a:'Steel strings are a narrow highway: slim neck, high tension, bright and loud. Nylon is a wide boulevard: flat wide neck, low tension, warm and soft on the fingertips.',b:'On nylon, keep the thumb low behind the neck and bring fingers straight down. On steel, press closer to the fret and expect two to three weeks before calluses form.',h:['Fret any note and press with the least force that still rings clean. It’s less than you think.','Move the fingertip right behind the fret wire and try again. It needs even less.','Set the app sound to match your guitar in Settings.'],go:['settings',{}],cta:'Open settings'},
];
LESSONS.push(
 {t:'The 12th fret is a mirror',a:'The neck repeats itself at fret 12, like a mirror laid across the double dots. Everything between the nut and fret 12 appears again above it, an octave higher.',b:'So each string has only 12 frets to learn, and the open-string names (E A D G B E) come back at fret 12.',h:['Play each open string, then the same string at fret 12. Same names, higher.','Find G on the low E string (fret 3), then find it again at fret 15.','Run Find every note for E: one on every string.'],go:['neck',{panel:'notes',note:4,show:'one'}],cta:'Find every E'},
 {t:'Octaves are a knight’s move',a:'Like a chess knight, an octave jumps in an L: two strings up and two frets up. When the jump lands on the B string it stretches to three frets, because that string is tuned a step lower than the pattern.',b:'Every note on the low E and A strings has a twin on the D and G strings this way. Learn the two lowest strings and the octave move hands you two more for free.',h:['Play C on the A string (fret 3), then two strings up and two frets up: G string, fret 5. Same note, higher.','From E on the D string (fret 2), jump to the B string: fret 5, three frets up.','Open the note map for C and trace each knight’s move with your finger before playing it.'],go:['neck',{panel:'notes',note:0,show:'one'}],cta:'Show every C'},
 {t:'One chord, five addresses (CAGED)',a:'A chord isn’t a place, it’s a set of notes. Like a family with five houses on one street, C major lives in five shapes up the neck: the open C, A, G, E and D shapes, each slid until its root lands on a C.',b:'The shapes link like train carriages: where one ends, the next begins, sharing notes. The order never changes (C, A, G, E, D, then C again), so learning the chain once lets you play any chord anywhere.',h:['Pick C major and step through the five shapes. Note which string the root is on in each.','Check each shape with String by string so you know the frets are right, not just the sound.','Walk the neck at 60 bpm, 8 beats per shape. Say the shape name as you move.'],go:['neck',{panel:'chords',root:0,q:'maj'}],cta:'Walk C across the neck'});
LESSONS.push(
 {t:'Chords have jobs: home, visit, road home',a:'In any key, three chords do most of the work. I is home. IV is visiting the neighbour: pleasant, a little away. V is the road home: restless until it lands back on I.',b:'Roman numerals name the job, not the chord. In G the jobs go to G, C and D; in C they go to C, F and G. Learn the jobs and every song in a key feels familiar.',h:['In G, play G (home), C (visit), D (road home), then G. Feel D lean back toward G.','Play D and stop. Notice how unfinished it feels: that pull is the V chord’s job.','Play the Pop four progression in G with listening on.'],go:['drills',{panel:'prog',prog:'pop',key:7}],cta:'Play the Pop four'},

LESSONS.push({t:'How the app listens: a teacher with eyes closed',a:'Picture a teacher who can’t see your hands. They hear footsteps (each new pluck or strum), recognise voices (the pitch of a single note) and taste the mix in a soup (which notes make up a strummed chord).',b:'That’s exactly what the app does. It catches the moment each note starts, measures its pitch, and compares a strum’s blend of notes with the chord you should be playing. The clearer the sound reaching the mic, the better it judges.',h:['Prop the phone or tablet about 30 cm from the sound hole, in a quiet room.','Run Settings → Calibrate timing once per device, and again if you switch to Bluetooth headphones.','Warm up with the live tuner and one chord check before the session.'],go:['settings',{}],cta:'Open listening settings'});

const CAL={on:false,unsub:null,clicks:[],hits:[]};
function calMsg(t){const e=$('#cal-msg');if(e)e.textContent=t;}
async function calStart(){
  if(!await ensureMic())return;claimRun(calStop);CAL.on=true;CAL.clicks=[];CAL.hits=[];
  CAL.unsub=Mic.sub(ev=>{if(ev.type==='onset')CAL.hits.push(ev.t+(state.settings.latency||0)/1000);});
  Clock.start(80,1,(k,t)=>{
    if(k<12){A.click(t,k%4===0);if(k>=4)CAL.clicks.push(t);at(t,()=>calMsg(k<4?`Count-in ${4-k}… get ready`:`Strum ${k-3} of 8`));}
    else if(k===13)at(t,calFinish);
  });
}
function calStop(){Clock.stop();if(CAL.unsub)CAL.unsub();CAL.unsub=null;CAL.on=false;releaseRun(calStop);}
function calFinish(){
  const offs=[];for(const c of CAL.clicks){const h=CAL.hits.filter(h=>h>c-0.15&&h<c+0.55).sort((a,b)=>a-b)[0];if(h!=null)offs.push(h-c);}
  calStop();
  if(offs.length<5){calMsg(`Heard ${offs.length} of 8 strums. Move closer to the phone or set Sensitivity to High, then try again.`);return;}
  offs.sort((a,b)=>a-b);const ms=Math.round(Math.max(0,Math.min(600,offs[offs.length>>1]*1000)));
  state.settings.latency=ms;state.settings.calibrated=true;save();renderSettings();
  calMsg(`Done. This device has about ${ms} ms of delay between sound and screen; it’s now subtracted from every timing reading.`);
}

let VIEW='today';
const RENDER={today:renderToday,chords:renderChords,scales:renderScales,neck:renderNeck,drills:renderDrills,ear:renderEar,learn:renderLearn};
function renderView(v){RENDER[v]();}
function show(v,keepScroll){
  if(!RENDER[v])v='today';
  if(v!==VIEW)stopRun();
  if(v!=='ear')tuneStop();
  VIEW=v;
  $$('[data-view]').forEach(s=>{const on=s.dataset.view===v;s.hidden=!on;if(!on)s.innerHTML='';});
  $$('nav [data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===v?'page':'false'));
  renderView(v);
  if(location.hash.slice(1)!==v){try{history.replaceState(null,'','#'+v);}catch(e){location.hash=v;}}
  if(!keepScroll)window.scrollTo(0,0);
}
function go(v,p){
  stopRun();
  if(v==='settings'){toggleSettings(true);return;}
  p=p||{};
  if(v==='scales'){Object.assign(SC,{whole:false},p);if(p.scale==='chrom'&&p.root==null)SC.root=0;scLoadTempo();if(p.bpm)SC.bpm=p.bpm;}
  if(v==='chords'&&p.chord)CS.sel=p.chord;
  if(v==='today'&&p.len){state.settings.sessLen=p.len;save();}
  if(v==='neck'){['panel','note','show','root','q'].forEach(k=>{if(p[k]!=null)NK[k]=p[k];});if(p.root!=null||p.q)NK.shape=0;}
  if(v==='drills'){if(p.panel)DR.panel=p.panel;if(p.pat)ST.pat=p.pat;if(p.prog)PG.prog=p.prog;if(p.key!=null)PG.key=p.key;if(p.a){CH.a=p.a;CH.b=p.b;CH.phase='idle';}if(p.set)RS.set=p.set.slice();if(p.per)RS.per=p.per;if(p.bpm)RS.bpm=p.bpm;}
  if(v==='ear'){if(p.panel)EAR.panel=p.panel;if(p.nfStr){EAR.nfStr=p.nfStr;EAR.nf=null;}}
  show(v);
}
function toggleSettings(force){const el=$('#settings'),open=force!=null?force:el.hidden;if(open)renderSettings();el.hidden=!open;$('#setbtn').setAttribute('aria-expanded',String(open));if(open)window.scrollTo(0,0);}

      const ta=$('#imp'),msg=$('#copy-msg');
      const fallback=()=>{ta.value=code;ta.focus();ta.select();msg.textContent='Selected below: copy it with your browser’s Copy.';};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(()=>{msg.textContent='Copied. Paste it on the other device.';},fallback);else fallback();break;}
   case 'load-prog':{const msg=$('#load-msg');let data=null;try{data=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));}catch(_){}
      if(!data||data.v!==1){msg.textContent='That doesn’t look like a progress code. Copy it again in full.';break;}
      if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.textContent='Tap again to replace this device’s progress';el.classList.add('primary');break;}
      state=merge(DEFAULT(),data);state.updatedAt=0;save();A.apply();renderSettings();renderView(VIEW);$('#load-msg').textContent='Progress loaded.';break;}
   case 'chord-drill':{const n=CS.sel,pairs=[].concat(PAIRS[1],PAIRS[2],PAIRS[3]),p=pairs.find(x=>x.includes(n));go('drills',{panel:'changes',a:n,b:p?(p[0]===n?p[1]:p[0]):(n==='G'?'C':'G')});break;}
   case 'bpm':{const d=+el.dataset.d;if(el.dataset.t==='sc')scSetBpm(SC.bpm+d);else if(el.dataset.t==='st'||el.dataset.t==='pg'){const o=el.dataset.t==='st'?ST:PG;o.bpm=Math.max(40,Math.min(200,o.bpm+d));if(o.on)Clock.bpm=o.bpm;$('#'+el.dataset.t+'-bpm').textContent=o.bpm;$('#'+el.dataset.t+'-range').value=o.bpm;}else if(el.dataset.t==='wk'){WK.bpm=Math.max(40,Math.min(200,WK.bpm+d));if(WK.on)Clock.bpm=WK.bpm;$('#wk-bpm').textContent=WK.bpm;$('#wk-range').value=WK.bpm;}else{RS.bpm=Math.max(40,Math.min(200,RS.bpm+d));Clock.bpm=RS.bpm;$('#rs-bpm').textContent=RS.bpm;$('#rs-range').value=RS.bpm;}break;}
   case 'sc-start':SC.running?scStop():scStart();break;
   case 'sc-next':scNext();break;
   case 'rs-toggle':{stopRun();const n=el.dataset.n,i=RS.set.indexOf(n);if(i>=0){if(RS.set.length>2)RS.set.splice(i,1);}else RS.set.push(n);renderRhythm();break;}
   case 'rs-start':RS.running?rsStop():rsStart();break;
   case 'ch-start':(CH.phase==='count'||CH.phase==='go')?chStop(false):chStart();break;
   case 'ch-tap':if(CH.phase==='go'){CH.count++;$('#ch-count').textContent=CH.count;if(navigator.vibrate)try{navigator.vibrate(12);}catch(_){}}break;
   case 'ch-adj':CH.count=Math.max(0,CH.count+(+el.dataset.d));$('#ch-final').textContent=CH.count;$('#ch-count').textContent=CH.count;break;
   case 'ch-save':{const k=pairKey(CH.a,CH.b);(state.changes[k]=state.changes[k]||[]).push({d:dkey(),s:CH.count});state.changes[k]=state.changes[k].slice(-40);ensureToday();state.today.done.changes=true;save();CH.phase='idle';renderChanges();break;}
   case 'ch-pair':stopRun();CH.a=el.dataset.a;CH.b=el.dataset.b;CH.phase='idle';renderChanges();break;
   case 'tune':tunePlay(+el.dataset.s);$$('.sbtn').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));break;
   case 'mm-play':mmPlay();break;
   case 'mm-ans':{if(!EAR.mm||EAR.mm.answered){feedback(false,'Play a chord first.');break;}const right=isMinor(EAR.mm.c.n)?'min':'maj',ok=el.dataset.v===right;EAR.mm.answered=true;state.ear.mm.t++;if(ok)state.ear.mm.c++;save();
      const c=EAR.mm.c;EAR.mm=null;renderEar();$$('.ans').forEach(b=>b.classList.add(b.dataset.v===right?'good':(b.dataset.v===el.dataset.v?'wrong':'x')));feedback(ok,`${ok?'Yes':'Not this time'}: that was ${label(c.n)}, ${right==='min'?'minor':'major'}. Press play for the next one.`);break;}
   case 'wc-play':A.init();if(!EAR.wc||EAR.wc.answered){wcNew();renderEar();}A.strum(EAR.wc.c.f,A.now());break;
   case 'wc-new':A.init();wcNew();renderEar();A.strum(EAR.wc.c.f,A.now());break;
   case 'wc-ans':{const q=EAR.wc;if(!q||q.answered)break;q.answered=true;const ok=el.dataset.n===q.c.n;state.ear.wc.t++;if(ok)state.ear.wc.c++;save();
      $$('[data-act="wc-ans"]').forEach(b=>{if(b.dataset.n===q.c.n)b.classList.add('good');else if(b===el)b.classList.add('wrong');});
      $('.score',$('#ear-body')).textContent=`${state.ear.wc.c} / ${state.ear.wc.t} correct`;
      feedback(ok,`${ok?'Right':'It was'} ${label(q.c.n)}. Press play for a new chord.`);$('#wc-reveal').innerHTML=chordSVG(q.c);break;}
   case 'nf-ans':{const q=EAR.nf;if(!q||q.answered)break;q.answered=true;const right=pc(OPEN[q.s]+q.f),ok=+el.dataset.v===right;state.ear.nf.t++;if(ok)state.ear.nf.c++;save();
      A.init();A.pluck(OPEN[q.s]+q.f,A.now(),0.6);
      $$('[data-act="nf-ans"]').forEach(b=>{if(+b.dataset.v===right)b.classList.add('good');else if(b===el)b.classList.add('wrong');});
      const dot=$('#nf-fb .nt');dot.classList.remove('now');dot.classList.add(ok?'good':'wrong');dot.querySelector('text').textContent=SHARP[right];
      feedback(ok,ok?'Correct.':`That one is ${BOTH[right]}.`);setTimeout(()=>{if(VIEW==='ear'&&EAR.panel==='nf'){nfNew();renderEar();}},ok?900:1800);break;}
   case 'try':{const l=LESSONS[+el.dataset.i];go(l.go[0],l.go[1]);break;}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sc-root'){stopRun();SC.root=+t.value;scLoadTempo();renderScales();}
  else if(t.id==='sc-scale'){stopRun();SC.scale=t.value;SC.pos=0;scLoadTempo();renderScales();}
  else if(t.id==='sc-pos'){stopRun();SC.pos=+t.value;scLoadTempo();renderScales();}
  else if(t.id==='st-chord'){stopRun();ST.chord=t.value;renderStrum();}
  else if(t.id==='pg-key'){stopRun();PG.key=+t.value;renderProg();}
  else if(t.id==='nk-note'){stopRun();NK.note=+t.value;FN.found=[];renderNeckNotes();}
  else if(t.id==='nk-root'){stopRun();NK.root=+t.value;NK.shape=0;renderNeckChords();}
  else if(t.id==='ch-a'||t.id==='ch-b'){stopRun();CH[t.id==='ch-a'?'a':'b']=t.value;CH.phase='idle';renderChanges();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sc-range')scSetBpm(+t.value);
  else if(t.id==='st-range'||t.id==='pg-range'){const k=t.id.slice(0,2),o=k==='st'?ST:PG;o.bpm=+t.value;if(o.on)Clock.bpm=o.bpm;$('#'+k+'-bpm').textContent=o.bpm;}
  else if(t.id==='wk-range'){WK.bpm=+t.value;if(WK.on)Clock.bpm=WK.bpm;$('#wk-bpm').textContent=WK.bpm;}
  else if(t.id==='rs-range'){RS.bpm=+t.value;Clock.bpm=RS.bpm;$('#rs-bpm').textContent=RS.bpm;}
  else if(t.id==='vol'){state.settings.vol=+t.value;if(A.ctx)A.master.gain.value=state.settings.vol;clearTimeout(window._vt);window._vt=setTimeout(save,500);}
});
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(VIEW==='scales'&&SC.running&&SC.mode==='wait'){e.preventDefault();scNext();}
  else if(VIEW==='drills'&&CH.phase==='go'){e.preventDefault();CH.count++;$('#ch-count').textContent=CH.count;}
});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==VIEW&&RENDER[v])show(v);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Run.stop)Wake.on();});

scLoadTempo();
show(RENDER[location.hash.slice(1)]?location.hash.slice(1):'today',true);
Sync.init();
</script>

</body></html>
